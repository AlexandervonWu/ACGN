name: Bounded artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-and-certificates:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Lean toolchain manager
        env:
          ELAN_HOME: ${{ runner.temp }}/acgn-elan
          ELAN_VERSION: v4.2.4
          ELAN_X86_64_LINUX_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          set -euo pipefail
          bootstrap_dir="$(mktemp -d "${RUNNER_TEMP}/acgn-elan-bootstrap.XXXXXX")"
          archive="${bootstrap_dir}/elan.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --output "${archive}" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${ELAN_X86_64_LINUX_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --file "${archive}" --directory "${bootstrap_dir}"
          "${bootstrap_dir}/elan-init" -y --default-toolchain none --no-modify-path
          printf '%s\n' "${ELAN_HOME}/bin" >> "${GITHUB_PATH}"
          printf 'ELAN_HOME=%s\n' "${ELAN_HOME}" >> "${GITHUB_ENV}"
      - name: Compile and audit cataloged rewrite obligations
        run: ./scripts/run_rewrite_rule_lean_checks.sh
      - name: Replay finite Java container traces in Lean from two clean builds
        run: python3 scripts/run_submission_container_closure.py /tmp/acgn-submission-container-closure
      - name: Refine the compiler-extracted Java selector and replay certified constructions
        run: python3 scripts/run_java_lean_refinement.py /tmp/acgn-java-lean-refinement
      - name: Check decomposition prerequisites and report remaining obligations
        run: python3 scripts/report_obligation_repairs.py --output /tmp/acgn-obligation-status
      - name: Replay the five bounded obligation repairs in two clean builds
        run: python3 scripts/run_bounded_obligation_repairs.py /tmp/acgn-bounded-five
      - name: Replay the next five bounded obligation repairs in two clean builds
        run: python3 -B scripts/run_next_obligation_repairs.py /tmp/acgn-next-five
      - name: Replay CALL authority, registry admission and guarded JOIN obligations
        run: python3 -B scripts/run_third_obligation_repairs.py /tmp/acgn-third-five
      - name: Compile and run bounded Java tests
        run: ./scripts/run_bounded_ci_java_tests.sh
      - name: Run clean producer and standalone verifier harness
        run: ./scripts/run_certificate_bundle_writer_tests.sh /tmp/acgn-certificate-ci

  fourth-obligation-closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Lean toolchain manager
        env:
          ELAN_HOME: ${{ runner.temp }}/acgn-elan
          ELAN_VERSION: v4.2.4
          ELAN_X86_64_LINUX_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          set -euo pipefail
          bootstrap_dir="$(mktemp -d "${RUNNER_TEMP}/acgn-elan-bootstrap.XXXXXX")"
          archive="${bootstrap_dir}/elan.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --output "${archive}" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${ELAN_X86_64_LINUX_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --file "${archive}" --directory "${bootstrap_dir}"
          "${bootstrap_dir}/elan-init" -y --default-toolchain none --no-modify-path
          printf '%s\n' "${ELAN_HOME}/bin" >> "${GITHUB_PATH}"
          printf 'ELAN_HOME=%s\n' "${ELAN_HOME}" >> "${GITHUB_ENV}"
      - name: Replay typed flattening, leaf and wire-index obligations
        run: python3 -B scripts/run_fourth_obligation_repairs.py /tmp/acgn-fourth-five
      - name: Retain closure reports and command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourth-obligation-closure-${{ github.sha }}
          path: |
            /tmp/acgn-fourth-five/report.json
            /tmp/acgn-fourth-five/input-manifest.json
            /tmp/acgn-fourth-five/*.log
            /tmp/acgn-fourth-five/build*/build-evidence.json
            /tmp/acgn-fourth-five/build*/artifacts.json

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  manifest-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate publication identity and report drift gates
        run: ./scripts/run_publication_manifest_tests.sh
      - name: Validate shell and Python entry points
        run: |
          bash -n scripts/run_publication_experiments.sh
          bash -n scripts/run_experiments_serial.sh
          bash -n scripts/run_egraph_ablation.sh
          bash -n scripts/run_capability_benchmark.sh
          python3 -m py_compile scripts/publication_manifest.py
