name: Bounded artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-and-certificates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Compile and audit cataloged rewrite obligations
        run: ./scripts/run_rewrite_rule_lean_checks.sh
      - name: Compile and run bounded Java tests
        run: ./scripts/run_bounded_ci_java_tests.sh
      - name: Run clean producer and standalone verifier harness
        run: ./scripts/run_certificate_bundle_writer_tests.sh /tmp/acgn-certificate-ci

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  manifest-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate publication identity and report drift gates
        run: ./scripts/run_publication_manifest_tests.sh
      - name: Validate shell and Python entry points
        run: |
          bash -n scripts/run_publication_experiments.sh
          bash -n scripts/run_experiments_serial.sh
          bash -n scripts/run_egraph_ablation.sh
          bash -n scripts/run_capability_benchmark.sh
          python3 -m py_compile scripts/publication_manifest.py
